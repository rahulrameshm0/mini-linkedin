{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini LinkedIn · Your professional community</title><link rel="stylesheet" href="{% static 'css/community.css' %}"></head><body><header><div class="nav"><a class="brand" href="{% url 'dashboard' %}">mini<span>in</span></a>{% if user.is_authenticated %}<form class="search" action="{% url 'dashboard' %}"><input name="q" value="{{ q }}" placeholder="Search posts and people" aria-label="Search posts"><button>Search</button></form><nav><a href="{% url 'dashboard' %}">Home</a><a href="{% url 'network' %}">My network</a><a href="{% url 'profile' user.username %}">My profile</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="plain">Sign out</button></form></nav>{% endif %}</div></header><div class="shell">{% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</div><footer>Mini LinkedIn · A place to grow together.</footer></body></html>
