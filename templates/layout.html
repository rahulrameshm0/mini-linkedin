{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini LinkedIn · Your professional community</title><script src="{% static 'js/theme.js' %}"></script><link rel="stylesheet" href="{% static 'css/community.css' %}"></head>
<body><a class="skip-link" href="#content">Skip to content</a><header><div class="nav"><a class="brand" href="{% url 'dashboard' %}" aria-label="Mini LinkedIn home">mini<span>in</span></a>{% if user.is_authenticated %}<form class="search nav-search" action="{% url 'dashboard' %}"><input name="q" value="{{ q }}" placeholder="Search your community" aria-label="Search posts"><button type="submit">Search</button></form><nav aria-label="Main navigation"><a {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %} href="{% url 'dashboard' %}">Home</a><a {% if request.resolver_match.url_name == 'network' %}aria-current="page"{% endif %} href="{% url 'network' %}">My network</a><a {% if request.resolver_match.url_name == 'profile' %}aria-current="page"{% endif %} href="{% url 'profile' user.username %}">My profile</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="plain">Sign out</button></form></nav>{% endif %}<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" hidden>Dark mode</button></div></header><div class="shell" id="content">{% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</div><footer><a class="footer-brand" href="{% url 'dashboard' %}">Mini LinkedIn</a><span>A place to grow together.</span></footer></body></html>
